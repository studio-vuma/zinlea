<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner Portal — Zinlea Health</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0A1730;
    --navy-900:#0F1F3D;
    --gold-600:#A9822F;
    --gold-500:#C0A24A;
    --paper:#F6F4EE;
    --ink:#12192B;
    --ink-soft:#5C6478;
    --hairline:#E3DECF;
    --rust:#8B4A3C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(800px 420px at 85% 0%,rgba(42,61,99,.9),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(110,54,38,.45),transparent 60%),linear-gradient(180deg,var(--navy-950),var(--navy-900));
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;flex-direction:column;gap:22px;
  }
  .brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;}
  .brand svg{width:40px;height:40px;}
  .brand-name{font-family:'Fraunces',serif;font-size:24px;line-height:1;}
  .brand-sub{display:block;font-size:10px;letter-spacing:.32em;font-weight:600;color:var(--gold-500);margin-top:5px;}
  .divs{display:flex;gap:16px;justify-content:center;margin:0 0 22px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .divs span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;}
  .back{color:#B9C2D6;font-size:13px;text-decoration:none;}
  .back:hover{color:#E2CF95;}
  .card{
    width:100%;max-width:400px;
    background:var(--paper);
    border-radius:20px;
    border-top:3px solid var(--gold-500);
    padding:36px 30px 30px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.6);
  }
  .wordmark{color:var(--gold-600);font-size:12px;letter-spacing:.16em;font-weight:600;margin:0 0 8px;text-align:center;}
  h1{font-family:'Fraunces',serif;color:var(--navy-900);font-weight:400;font-size:28px;margin:0 0 6px;text-align:center;}
  p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;text-align:center;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:11px 12px;
    border:1px solid var(--hairline);border-radius:10px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold-500);box-shadow:0 0 0 3px rgba(192,162,74,.2);}
  button{
    width:100%;margin-top:18px;padding:14px;border-radius:999px;border:none;transition:background .2s;
    background:var(--navy-900);color:#fff;font-family:'Inter',sans-serif;
    font-size:14.5px;font-weight:600;cursor:pointer;
  }
  button:hover{background:var(--navy-950);}
  button:disabled{opacity:.6;cursor:default;}
  .error{
    display:none;margin-top:14px;padding:9px 12px;border-radius:8px;
    background:#F1E3DF;color:var(--rust);font-size:12.5px;text-align:center;
  }
  .error.show{display:block;}
</style>
</head>
<body>
  <a class="brand" href="/" aria-label="Zinlea Health website">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#C0A24A" stroke-width="1.2"/><path d="M13 13.5h14L13.5 26.5H27" fill="none" stroke="#C0A24A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span><span class="brand-name">Zinlea</span><span class="brand-sub">HEALTH</span></span>
  </a>
  <main class="card">
    <p class="wordmark">PRIVATE ACCESS</p>
    <h1>Partner Portal</h1>
    <p class="sub">This area is restricted. Choose your name and enter your passcode to continue.</p>
    <div class="divs" aria-hidden="true"><span><i class="dot" style="background:#7C93C9"></i>Zinlea Night</span><span><i class="dot" style="background:#D08A3E"></i>Zinlea Global</span></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Who are you?</label>
        <select id="username" name="username" required>
          <option value="" disabled selected>Select…</option>
          <option value="blessings">Blessings</option>
          <option value="francis">Francis</option>
        </select>
      </div>
      <div class="field">
        <label for="password">Passcode</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn">Enter</button>
      <div class="error" id="error">Incorrect name or passcode. Try again.</div>
    </form>
  </main>
  <a class="back" href="/">&larr; Back to zinlea.com</a>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('submitBtn');
const errorEl = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Checking…';

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/.netlify/functions/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.ok) {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next') || '';
      // Only follow same-site relative paths, to avoid open redirects.
      window.location.href = /^\/(?!\/)/.test(next) ? next : '/portal/';
      return;
    }

    errorEl.textContent = res.status === 401 ? 'Incorrect name or passcode. Try again.' : 'Something went wrong. Try again.';
    errorEl.classList.add('show');
  } catch (err) {
    errorEl.textContent = 'Could not reach the server. Try again.';
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enter';
  }
});
</script>
</body>
</html>
