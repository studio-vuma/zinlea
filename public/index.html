<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Zinlea Night — Partnership CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0A1730;
    --navy-900:#0F1F3D;
    --gold-600:#A9822F;
    --gold-500:#C0A24A;
    --paper:#F6F4EE;
    --paper-card:#FFFFFF;
    --ink:#12192B;
    --ink-soft:#5C6478;
    --hairline:#E3DECF;
    --green:#3F6C51;
    --green-bg:#E7EFE8;
    --amber:#96702A;
    --amber-bg:#F3E9D3;
    --slate:#5B6472;
    --slate-bg:#EAEAE6;
    --rust:#8B4A3C;
    --rust-bg:#F1E3DF;
    --blue:#3B5B79;
    --blue-bg:#E4ECF1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:96px;
  }
  .app{max-width:640px;margin:0 auto;}

  header.top{
    background:linear-gradient(180deg,var(--navy-950),var(--navy-900));
    padding:22px 20px 20px;
    border-bottom:2px solid var(--gold-500);
    position:sticky;top:0;z-index:20;
  }
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .wordmark{color:var(--gold-500);font-size:12px;letter-spacing:.16em;font-weight:600;margin:0 0 6px;}
  header.top h1{font-family:'Fraunces',serif;color:#fff;font-weight:600;font-size:24px;margin:0;letter-spacing:.01em;}
  header.top p.sub{color:#B9C2D6;font-size:13px;margin:4px 0 0;}
  .private-pill{
    flex-shrink:0;display:flex;align-items:center;gap:5px;
    background:rgba(192,162,74,0.14);border:1px solid rgba(192,162,74,0.4);
    color:var(--gold-500);font-size:11px;font-weight:600;letter-spacing:.03em;
    padding:5px 10px;border-radius:20px;white-space:nowrap;
  }

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 4px;}
  .stat{background:var(--paper-card);border:1px solid var(--hairline);border-radius:10px;padding:12px 14px;}
  .stat .num{font-family:'Fraunces',serif;font-size:21px;color:var(--navy-900);font-weight:600;line-height:1.1;}
  .stat .num.gold{color:var(--gold-600);}
  .stat .label{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .controls{display:flex;gap:8px;padding:14px 16px 6px;flex-wrap:wrap;}
  select.filter{
    flex:1;min-width:140px;
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);
    background:var(--paper-card);border:1px solid var(--hairline);
    border-radius:8px;padding:9px 10px;
  }

  .list{padding:8px 16px 20px;display:flex;flex-direction:column;gap:10px;}

  .empty{text-align:center;padding:48px 24px;color:var(--ink-soft);}
  .empty h2{font-family:'Fraunces',serif;color:var(--navy-900);font-size:18px;margin:0 0 6px;font-weight:600;}
  .empty p{font-size:13.5px;line-height:1.5;margin:0;}

  .card{background:var(--paper-card);border:1px solid var(--hairline);border-radius:10px;padding:14px 14px 12px;cursor:pointer;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-org{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;color:var(--navy-900);line-height:1.25;}
  .card-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .hr{border:none;border-top:1px solid var(--hairline);margin:10px 0;}
  .card-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:5px;gap:10px;}
  .card-row span:first-child{flex-shrink:0;}
  .card-row b{color:var(--ink);font-weight:600;text-align:right;}

  .fab{
    position:fixed;bottom:24px;right:20px;
    width:52px;height:52px;border-radius:50%;
    background:var(--navy-900);border:2px solid var(--gold-500);color:var(--gold-500);
    font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(10,23,48,0.35);z-index:25;
  }

  .overlay{position:fixed;inset:0;background:rgba(10,17,35,0.5);display:none;z-index:30;align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--paper);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px 24px;}
  .sheet h2{font-family:'Fraunces',serif;color:var(--navy-900);font-size:18px;margin:0 0 4px;font-weight:600;}
  .section-label{
    font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold-600);
    text-transform:uppercase;margin:18px 0 8px;
  }
  .section-label:first-of-type{margin-top:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;
    border:1px solid var(--hairline);border-radius:8px;background:#fff;color:var(--ink);
  }
  .field textarea{min-height:52px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  .log-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .log-entry{
    background:#fff;border:1px solid var(--hairline);border-radius:8px;
    padding:7px 10px;font-size:12.5px;
  }
  .log-entry .log-date{color:var(--ink-soft);font-size:11px;margin-bottom:2px;}
  .log-add{display:flex;gap:8px;}
  .log-add input{flex:1;}
  .log-add button{
    flex-shrink:0;background:var(--navy-900);color:#fff;border:none;border-radius:8px;
    padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;
  }

  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;padding:11px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;}
  .btn.primary{background:var(--navy-900);color:#fff;}
  .btn.ghost{background:none;border:1px solid var(--hairline);color:var(--ink-soft);}
  .btn.delete{background:none;border:1px solid var(--rust);color:var(--rust);}

  .loading-msg{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 20px;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--navy-900);color:#fff;padding:9px 16px;border-radius:20px;
    font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div>
        <p class="wordmark">ZINLEA NIGHT</p>
        <h1>Partnership CRM</h1>
        <p class="sub">Strategic partnerships tracker</p>
      </div>
      <a href="/.netlify/functions/logout" class="private-pill" style="text-decoration:none;">🔒 Sign out</a>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <select class="filter" id="stageFilter"></select>
    <select class="filter" id="typeFilter"></select>
  </div>

  <div class="list" id="list">
    <div class="loading-msg">Loading pipeline…</div>
  </div>
</div>

<div class="fab" id="openAdd">+</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Add record</h2>
    <div id="formFields"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn delete" id="deleteBtn">Delete record</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = '/.netlify/functions/records';

const ORG_TYPES = ['Care home','Private healthcare group','Concierge service','Corporate client','Family office','Private residence','Other'];
const LEAD_SOURCES = ['Referral','LinkedIn','Event','Direct outreach','Existing relationship','Other'];

const STAGES = [
  {v:'lead', label:'Lead', bg:'var(--slate-bg)', text:'var(--slate)'},
  {v:'qualified', label:'Qualified Lead', bg:'var(--blue-bg)', text:'var(--blue)'},
  {v:'opportunity', label:'Opportunity', bg:'var(--amber-bg)', text:'var(--amber)'},
  {v:'proposal', label:'Proposal', bg:'#F3EBD6', text:'var(--gold-600)'},
  {v:'contract', label:'Contract', bg:'#F3EBD6', text:'var(--gold-600)'},
  {v:'revenue', label:'Revenue', bg:'var(--green-bg)', text:'var(--green)'}
];

const CONTRACT_STATUSES = ['Not started','Proposal','Negotiation','Signed'];
const PAYMENT_STATUSES = ['Awaiting payment','Part-paid','Paid'];

const TIERS = [
  {v:'introduction', label:'Introduction', pct:7.5},
  {v:'standard', label:'Standard founding', pct:10},
  {v:'strategic', label:'Strategic', pct:12.5},
  {v:'exceptional', label:'Exceptional / group', pct:15}
];

let records = [];
let editingId = null;
let currentLog = [];

function stageMeta(v){ return STAGES.find(s=>s.v===v) || STAGES[0]; }
function tierMeta(v){ return TIERS.find(t=>t.v===v) || TIERS[1]; }
function gbp(n){ if (isNaN(n)) n = 0; return '£' + Number(n).toLocaleString('en-GB', {maximumFractionDigits:0}); }
function escapeHtml(s){ if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadData(){
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('load failed');
    records = await res.json();
    if (!Array.isArray(records)) records = [];
  } catch (e) {
    records = [];
    showToast('Could not load records');
  }
  buildFilters();
  render();
}

async function saveData(){
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(records)
    });
    if (!res.ok) showToast('Could not save — try again');
  } catch (e) { showToast('Could not save — try again'); }
}

function buildFilters(){
  const sf = document.getElementById('stageFilter');
  sf.innerHTML = '<option value="all">All stages</option>' + STAGES.map(s=>`<option value="${s.v}">${s.label}</option>`).join('');
  sf.addEventListener('change', render);
  const tf = document.getElementById('typeFilter');
  tf.innerHTML = '<option value="all">All organisation types</option>' + ORG_TYPES.map(m=>`<option value="${m}">${m}</option>`).join('');
  tf.addEventListener('change', render);
}

function computeStats(){
  const open = records.filter(r=>r.stage!=='revenue' && r.paymentStatus!=='Paid');
  const revenue = records.filter(r=>r.stage==='revenue');
  const totalMonthly = open.reduce((s,r)=>s+(Number(r.monthly)||0),0);
  const totalCommission = records.reduce((s,r)=>{
    const annual = (Number(r.monthly)||0)*12;
    const pct = tierMeta(r.tier).pct;
    return s + annual*(pct/100);
  },0);
  return { openCount: open.length, revenueCount: revenue.length, totalMonthly, totalCommission };
}

function renderStats(){
  const s = computeStats();
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${s.openCount}</div><div class="label">Open pipeline</div></div>
    <div class="stat"><div class="num gold">${s.revenueCount}</div><div class="label">At revenue stage</div></div>
    <div class="stat"><div class="num">${gbp(s.totalMonthly)}</div><div class="label">Open monthly value</div></div>
    <div class="stat"><div class="num gold">${gbp(s.totalCommission)}</div><div class="label">Est. total commission</div></div>
  `;
}

function render(){
  renderStats();
  const stageF = document.getElementById('stageFilter').value;
  const typeF = document.getElementById('typeFilter').value;
  let items = records.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  if (stageF && stageF !== 'all') items = items.filter(r=>r.stage===stageF);
  if (typeF && typeF !== 'all') items = items.filter(r=>r.orgType===typeF);

  const list = document.getElementById('list');
  if (items.length === 0){
    list.innerHTML = `<div class="empty"><h2>No records here yet</h2><p>Add an organisation to start building the pipeline.</p></div>`;
    return;
  }

  list.innerHTML = items.map(r=>{
    const sm = stageMeta(r.stage);
    const tm = tierMeta(r.tier);
    const annual = (Number(r.monthly)||0)*12;
    const commission = annual*(tm.pct/100);
    const locLine = [r.orgType, r.location].filter(Boolean).join(' · ');
    return `
    <div class="card" data-id="${r.id}">
      <div class="card-top">
        <div>
          <div class="card-org">${escapeHtml(r.org)}</div>
          <div class="card-sub">${escapeHtml(locLine || '—')}</div>
        </div>
        <span class="badge" style="background:${sm.bg};color:${sm.text}">${sm.label}</span>
      </div>
      <div class="badge-row">
        ${r.contractStatus ? `<span class="badge" style="background:var(--slate-bg);color:var(--slate)">${escapeHtml(r.contractStatus)}</span>` : ''}
        ${r.paymentStatus ? `<span class="badge" style="background:var(--green-bg);color:var(--green)">${escapeHtml(r.paymentStatus)}</span>` : ''}
      </div>
      <hr class="hr">
      <div class="card-row"><span>Opportunity value</span><b>${gbp(r.monthly)} / mo</b></div>
      <div class="card-row"><span>Commission</span><b>${tm.label} · ${tm.pct}% (${gbp(commission)})</b></div>
      ${r.contact ? `<div class="card-row"><span>Contact</span><b>${escapeHtml(r.contact)}${r.jobTitle ? ', '+escapeHtml(r.jobTitle) : ''}</b></div>` : ''}
      ${r.nextAction ? `<div class="card-row"><span>Next action</span><b>${escapeHtml(r.nextAction)}${r.followUpDate ? ' · '+r.followUpDate : ''}</b></div>` : ''}
      ${r.loggedBy ? `<div class="card-row"><span>Logged by</span><b>${escapeHtml(r.loggedBy)}</b></div>` : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> openEdit(el.dataset.id));
  });
}

function renderLogList(){
  const el = document.getElementById('logList');
  if (!el) return;
  if (currentLog.length === 0){
    el.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">No entries logged yet.</div>`;
    return;
  }
  el.innerHTML = currentLog.slice().reverse().map(e=>`
    <div class="log-entry">
      <div class="log-date">${e.date}${e.by ? ' · '+escapeHtml(e.by) : ''}</div>
      <div>${escapeHtml(e.text)}</div>
    </div>
  `).join('');
}

function addLogEntry(){
  const input = document.getElementById('logInput');
  const text = input.value.trim();
  if (!text) return;
  const byField = document.getElementById('f-loggedBy');
  const by = byField ? byField.value.trim() : '';
  currentLog.push({date: new Date().toLocaleDateString('en-GB'), text, by});
  input.value = '';
  renderLogList();
}

function formHtml(r){
  r = r || {};
  return `
    <div class="field">
      <label>Logged by</label>
      <input type="text" id="f-loggedBy" value="${escapeHtml(r.loggedBy||'')}" placeholder="Your name">
    </div>
    <div class="section-label">Organisation</div>
    <div class="field">
      <label>Organisation name</label>
      <input type="text" id="f-org" value="${escapeHtml(r.org||'')}" placeholder="e.g. Wren Park Care Home">
    </div>
    <div class="row2">
      <div class="field">
        <label>Organisation type</label>
        <select id="f-orgType">
          <option value="">Select…</option>
          ${ORG_TYPES.map(m=>`<option value="${m}" ${r.orgType===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" id="f-location" value="${escapeHtml(r.location||'')}" placeholder="e.g. Chelsea, London">
      </div>
    </div>
    <div class="field">
      <label>Lead source</label>
      <select id="f-leadSource">
        <option value="">Select…</option>
        ${LEAD_SOURCES.map(m=>`<option value="${m}" ${r.leadSource===m?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>

    <div class="section-label">Contact</div>
    <div class="row2">
      <div class="field">
        <label>Decision-maker</label>
        <input type="text" id="f-contact" value="${escapeHtml(r.contact||'')}">
      </div>
      <div class="field">
        <label>Job title</label>
        <input type="text" id="f-jobTitle" value="${escapeHtml(r.jobTitle||'')}">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Email</label>
        <input type="text" id="f-email" value="${escapeHtml(r.email||'')}">
      </div>
      <div class="field">
        <label>Telephone</label>
        <input type="text" id="f-phone" value="${escapeHtml(r.phone||'')}">
      </div>
    </div>

    <div class="section-label">Opportunity</div>
    <div class="field">
      <label>Current provision</label>
      <input type="text" id="f-currentProvision" value="${escapeHtml(r.currentProvision||'')}" placeholder="What overnight clinical provision do they use now?">
    </div>
    <div class="field">
      <label>Interest</label>
      <textarea id="f-interest" placeholder="What are they interested in from Zinlea Night?">${escapeHtml(r.interest||'')}</textarea>
    </div>
    <div class="field">
      <label>Objections</label>
      <textarea id="f-objections" placeholder="Pricing, clinical model, procurement, governance…">${escapeHtml(r.objections||'')}</textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label>Next action</label>
        <input type="text" id="f-nextAction" value="${escapeHtml(r.nextAction||'')}" placeholder="e.g. Send proposal">
      </div>
      <div class="field">
        <label>Follow-up date</label>
        <input type="date" id="f-followUpDate" value="${r.followUpDate||''}">
      </div>
    </div>

    <div class="section-label">Status &amp; value</div>
    <div class="field">
      <label>Pipeline stage</label>
      <select id="f-stage">
        ${STAGES.map(s=>`<option value="${s.v}" ${r.stage===s.v?'selected':''}>${s.label}</option>`).join('')}
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Contract status</label>
        <select id="f-contractStatus">
          ${CONTRACT_STATUSES.map(m=>`<option value="${m}" ${r.contractStatus===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Payment status</label>
        <select id="f-paymentStatus">
          ${PAYMENT_STATUSES.map(m=>`<option value="${m}" ${r.paymentStatus===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Opportunity value (£/month)</label>
        <input type="number" id="f-monthly" value="${r.monthly||''}" placeholder="e.g. 6000">
      </div>
      <div class="field">
        <label>Commission tier</label>
        <select id="f-tier">
          ${TIERS.map(t=>`<option value="${t.v}" ${r.tier===t.v?'selected':''}>${t.label} (${t.pct}%)</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="section-label">Engagement history</div>
    <div class="log-list" id="logList"></div>
    <div class="log-add">
      <input type="text" id="logInput" placeholder="Log a call, email, meeting, presentation…">
      <button type="button" id="logAddBtn">Log</button>
    </div>

    <div class="section-label">Market intelligence</div>
    <div class="field">
      <textarea id="f-marketIntel" placeholder="Competitor information, customer feedback, pricing…">${escapeHtml(r.marketIntel||'')}</textarea>
    </div>
  `;
}

function openAdd(){
  editingId = null;
  currentLog = [];
  document.getElementById('sheetTitle').textContent = 'Add record';
  document.getElementById('formFields').innerHTML = formHtml({stage:'lead', tier:'standard', contractStatus:'Not started', paymentStatus:'Awaiting payment'});
  document.getElementById('deleteRow').style.display = 'none';
  document.getElementById('logAddBtn').addEventListener('click', addLogEntry);
  renderLogList();
  document.getElementById('overlay').classList.add('open');
}

function openEdit(id){
  const r = records.find(x=>x.id===id);
  if (!r) return;
  editingId = id;
  currentLog = (r.engagementLog || []).slice();
  document.getElementById('sheetTitle').textContent = 'Edit record';
  document.getElementById('formFields').innerHTML = formHtml(r);
  document.getElementById('deleteRow').style.display = 'flex';
  document.getElementById('logAddBtn').addEventListener('click', addLogEntry);
  renderLogList();
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }

async function handleSave(){
  const org = document.getElementById('f-org').value.trim();
  if (!org){ showToast('Organisation name is required'); return; }
  const data = {
    org,
    loggedBy: document.getElementById('f-loggedBy').value.trim(),
    orgType: document.getElementById('f-orgType').value,
    location: document.getElementById('f-location').value.trim(),
    leadSource: document.getElementById('f-leadSource').value,
    contact: document.getElementById('f-contact').value.trim(),
    jobTitle: document.getElementById('f-jobTitle').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    currentProvision: document.getElementById('f-currentProvision').value.trim(),
    interest: document.getElementById('f-interest').value.trim(),
    objections: document.getElementById('f-objections').value.trim(),
    nextAction: document.getElementById('f-nextAction').value.trim(),
    followUpDate: document.getElementById('f-followUpDate').value,
    stage: document.getElementById('f-stage').value,
    contractStatus: document.getElementById('f-contractStatus').value,
    paymentStatus: document.getElementById('f-paymentStatus').value,
    monthly: parseFloat(document.getElementById('f-monthly').value) || 0,
    tier: document.getElementById('f-tier').value,
    engagementLog: currentLog,
    marketIntel: document.getElementById('f-marketIntel').value.trim()
  };

  if (editingId){
    const idx = records.findIndex(r=>r.id===editingId);
    if (idx > -1) records[idx] = {...records[idx], ...data};
  } else {
    data.id = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    data.created = Date.now();
    records.push(data);
  }
  closeSheet();
  render();
  await saveData();
  showToast('Saved');
}

async function handleDelete(){
  if (!editingId) return;
  if (!confirm('Delete this record? This cannot be undone.')) return;
  records = records.filter(r=>r.id!==editingId);
  closeSheet();
  render();
  await saveData();
  showToast('Deleted');
}

document.getElementById('openAdd').addEventListener('click', openAdd);
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', handleSave);
document.getElementById('deleteBtn').addEventListener('click', handleDelete);
document.getElementById('overlay').addEventListener('click', (e)=>{ if (e.target.id === 'overlay') closeSheet(); });

loadData();
</script>
</body>
</html>
