# One public address. Once zinzilevuma.com is set as the primary domain in
# Netlify, the netlify.app address redirects to it automatically.
[[redirects]]
  from = "https://www.zinzilevuma.com/*"
  to = "https://zinzilevuma.com/:splat"
  status = 301
  force = true
